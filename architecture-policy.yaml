version: 1

# 存量模块先标记为 legacy；新模块或完成迁移的模块设置 managed: true。
modules:
  - id: rpc
    roots: [packages/rpc/src]
    managed: false
  - id: shared
    roots: [packages/shared/src]
    managed: false
  - id: provider
    roots: [packages/provider/src]
    managed: false
  - id: provider-node
    roots: [packages/provider-node/src]
    managed: false
  - id: services
    roots: [packages/services/src]
    managed: false
  - id: session
    roots: [packages/services/src/session]
    managed: false
    requires: [shared]
    publicEntrypoints: [packages/services/src/session/contract.ts]
    owner: conversation
  - id: storage
    roots: [packages/services/src/storage]
    managed: true
    requires: [shared, rpc, services]
    publicEntrypoints: [packages/services/src/storage/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: desktop-settings
  - id: contracts
    roots: [packages/adcos-contracts/src]
    managed: true
    requires: [shared]
    publicEntrypoints: [packages/adcos-contracts/src/index.ts]
    owner: platform-substrate
  # --- ADCOS 2.0 collective-economy domain (P2-W3 design §1.3; TL-serialized) ---
  - id: economics
    roots: [packages/economics/src]
    managed: true
    requires: [contracts]
    publicEntrypoints: [packages/economics/src/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: collective-economy
  - id: organizations
    roots: [packages/organizations/src]
    managed: true
    requires: [contracts, economics]
    publicEntrypoints: [packages/organizations/src/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: collective-economy
  - id: group-purchasing
    roots: [packages/group-purchasing/src]
    managed: true
    requires: [contracts, economics]
    publicEntrypoints: [packages/group-purchasing/src/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: collective-economy
  - id: lab
    roots: [packages/lab/src]
    managed: true
    requires: [contracts, economics]
    publicEntrypoints: [packages/lab/src/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: collective-economy
  - id: simulation
    roots: [packages/simulation/src]
    managed: true
    requires: [contracts, economics, organizations, group-purchasing, lab]
    publicEntrypoints: [packages/simulation/src/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: collective-economy
  # --- P2-W1 product surfaces; P2-W2 instance coordination (TL-serialized) ---
  - id: surfaces
    roots: [packages/surfaces/src]
    managed: true
    requires: [contracts, shared, ui, web, economics, lab, organizations, group-purchasing]
    publicEntrypoints: [packages/surfaces/src/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: product-surfaces
  - id: coordination
    roots: [packages/coordination/src]
    managed: true
    requires: [contracts, shared, services]
    publicEntrypoints: [packages/coordination/src/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: instance-coordination
  - id: client
    roots: [packages/client/src]
    managed: false
  - id: server
    roots: [packages/server/src]
    managed: false
  - id: zcode-server-cli
    roots: [packages/zcode-server-cli/src]
    managed: false
  - id: ui
    roots: [packages/ui/src]
    managed: false
  - id: web
    roots: [packages/web/src]
    managed: false
  - id: desktop
    roots: [packages/desktop/src]
    managed: false
  - id: formal-proof
    roots: [packages/formal-proof/src]
    managed: false
  - id: zcode-cli
    roots: [apps/zcode-cli]
    managed: false

global:
  maxFileLines: 400
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true

exceptions: []
